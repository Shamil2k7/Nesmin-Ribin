    <path d="M 125 75 Q 146 80 162 90" />

    <path d="M 75 125 C 60 145 70 170 90 162 C 92 145 82 130 75 125 Z" />
    <path d="M 75 125 Q 80 146 90 162" />

    <!-- Eucalyptus styled round leaves -->
    <ellipse cx="185" cy="140" rx="14" ry="9" transform="rotate(-30 185 140)" />
    <ellipse cx="140" cy="185" rx="9" ry="14" transform="rotate(-30 140 185)" />
    
