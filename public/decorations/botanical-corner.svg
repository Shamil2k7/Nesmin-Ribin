    <circle cx="128" cy="22" r="2" fill="#A58B61" />
    <circle cx="28" cy="115" r="2.5" fill="#A58B61" />
    <circle cx="22" cy="128" r="2" fill="#A58B61" />
    <circle cx="210" cy="120" r="2.2" fill="#A58B61" />
    <circle cx="120" cy="210" r="2.2" fill="#A58B61" />
    <circle cx="255" cy="235" r="2.5" fill="#A58B61" />
    <circle cx="235" cy="255" r="2.5" fill="#A58B61" />

